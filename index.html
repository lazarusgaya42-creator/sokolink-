<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SokoLink — Live Shop Stock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

  <!-- Top Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 id="shop-name" class="text-lg font-bold tracking-tight text-gray-900">Loading shop...</h1>
        <p id="shop-location" class="text-xs text-gray-500 mt-0.5"></p>
      </div>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800">
        Live Stock
      </span>
    </div>
  </header>

  <!-- Main Product Feed -->
  <main class="max-w-md mx-auto px-4 py-6">
    <div id="items-grid" class="space-y-5">
      <p class="text-center text-sm text-gray-400 py-10">Checking real-time inventory...</p>
    </div>
  </main>

  <!-- Booking / Waitlist Modal -->
  <div id="action-modal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl">
      <div class="flex justify-between items-start mb-4">
        <div>
          <span id="modal-badge" class="text-xs font-semibold uppercase tracking-wider text-emerald-600">Reserve Item</span>
          <h2 id="modal-item-title" class="text-lg font-bold text-gray-900 mt-0.5"></h2>
          <p id="modal-item-price" class="text-sm font-medium text-gray-600"></p>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <form id="action-form" class="space-y-4">
        <div id="name-field">
          <label class="block text-xs font-medium text-gray-700 mb-1">Your Name</label>
          <input type="text" id="buyer-name" placeholder="e.g. Brian Kamau" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Your WhatsApp Number</label>
          <input type="tel" id="buyer-whatsapp" required placeholder="e.g. 0712345678" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>

        <div id="fulfillment-fields" class="space-y-3">
          <label class="block text-xs font-medium text-gray-700">How would you like to get it?</label>
          <div class="grid grid-cols-2 gap-2">
            <label class="border border-gray-200 rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50">
              <input type="radio" name="fulfillment" value="pickup" checked onchange="toggleDeliveryNote()" class="accent-emerald-600" />
              <span class="text-sm font-medium">Shop Pickup</span>
            </label>
            <label class="border border-gray-200 rounded-xl p-3 flex items-center gap-2 cursor-pointer has-[:checked]:border-emerald-600 has-[:checked]:bg-emerald-50">
              <input type="radio" name="fulfillment" value="delivery" onchange="toggleDeliveryNote()" class="accent-emerald-600" />
              <span class="text-sm font-medium">Delivery</span>
            </label>
          </div>
          <div id="delivery-note-box" class="hidden">
            <input type="text" id="delivery-note" placeholder="Enter delivery area / building (e.g. Westlands, Mpaka Rd)" class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3 rounded-xl font-semibold text-white bg-emerald-600 hover:bg-emerald-700 transition text-sm">
          Confirm Booking
        </button>
      </form>
    </div>
  </div>

  <script>
    // ==========================================
    // PASTE YOUR SUPABASE KEYS BELOW
    // ==========================================
    const SUPABASE_URL = 'https://ylvowldoanbluuctolnf.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'sb_publishable_JF3jnk7nkttbVL_I5F0RhA_9SIJQigH';
    // ==========================================

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentShop = null;
    let selectedItem = null;
    let modalMode = 'book'; // 'book' or 'waitlist'

    // Read ?shop=slug from URL, default to 'demo-shop'
    const params = new URLSearchParams(window.location.search);
    const shopSlug = params.get('shop') || 'demo-shop';

    async function loadStorefront() {
      const { data: shop, error: shopErr } = await db
        .from('shops')
        .select('*')
        .eq('slug', shopSlug)
        .single();

      if (shopErr || !shop) {
        document.getElementById('shop-name').textContent = 'Shop Not Found';
        document.getElementById('items-grid').innerHTML = `<p class="text-center text-sm text-red-500 py-10">Check your shop link or Supabase keys.</p>`;
        return;
      }

      currentShop = shop;
      document.getElementById('shop-name').textContent = shop.shop_name;
      document.getElementById('shop-location').textContent = shop.pickup_location ? `📍 ${shop.pickup_location}` : '';

      const { data: items, error: itemsErr } = await db
        .from('items')
        .select('*')
        .eq('shop_id', shop.id)
        .order('created_at', { ascending: false });

      const grid = document.getElementById('items-grid');
      if (itemsErr || !items || items.length === 0) {
        grid.innerHTML = `<p class="text-center text-sm text-gray-500 py-10">No items listed yet.</p>`;
        return;
      }

      grid.innerHTML = items.map(item => `
        <div class="bg-white rounded-2xl border border-gray-200 overflow-hidden shadow-sm">
          <div class="relative aspect-[4/3] bg-gray-100">
            <img src="${item.image_url || 'https://placehold.co/600x450?text=No+Image'}" alt="${item.name}" class="w-full h-full object-cover ${!item.in_stock ? 'opacity-60 grayscale' : ''}" />
            <span class="absolute top-3 left-3 px-2.5 py-1 rounded-lg text-xs font-bold ${item.in_stock ? 'bg-emerald-600 text-white' : 'bg-gray-900 text-white'}">
              ${item.in_stock ? 'IN STOCK' : 'OUT OF STOCK'}
            </span>
          </div>
          <div class="p-4">
            <div class="flex justify-between items-start gap-2">
              <h3 class="font-semibold text-gray-900 text-base leading-snug">${item.name}</h3>
              <span class="font-bold text-gray-900 whitespace-nowrap">KES ${item.price_kes.toLocaleString()}</span>
            </div>
            <div class="mt-4">
              ${item.in_stock
                ? `<button onclick='openModal(${JSON.stringify(item)}, "book")' class="w-full py-2.5 px-4 bg-gray-900 hover:bg-gray-800 text-white font-medium text-sm rounded-xl transition">Book Pickup / Delivery</button>`
                : `<button onclick='openModal(${JSON.stringify(item)}, "waitlist")' class="w-full py-2.5 px-4 bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 font-medium text-sm rounded-xl transition">🔔 Notify Me When Back</button>`
              }
            </div>
          </div>
        </div>
      `).join('');
    }

    function openModal(item, mode) {
      selectedItem = item;
      modalMode = mode;
      document.getElementById('modal-item-title').textContent = item.name;
      document.getElementById('modal-item-price').textContent = `KES ${item.price_kes.toLocaleString()}`;

      if (mode === 'book') {
        document.getElementById('modal-badge').textContent = 'Reserve Item';
        document.getElementById('name-field').classList.remove('hidden');
        document.getElementById('buyer-name').required = true;
        document.getElementById('fulfillment-fields').classList.remove('hidden');
        document.getElementById('submit-btn').textContent = 'Confirm & Notify Seller';
        document.getElementById('submit-btn').className = 'w-full py-3 rounded-xl font-semibold text-white bg-emerald-600 hover:bg-emerald-700 transition text-sm';
      } else {
        document.getElementById('modal-badge').textContent = 'Restock Alert';
        document.getElementById('name-field').classList.add('hidden');
        document.getElementById('buyer-name').required = false;
        document.getElementById('fulfillment-fields').classList.add('hidden');
        document.getElementById('submit-btn').textContent = 'Join Restock Waitlist';
        document.getElementById('submit-btn').className = 'w-full py-3 rounded-xl font-semibold text-white bg-amber-600 hover:bg-amber-700 transition text-sm';
      }

      document.getElementById('action-modal').classList.remove('hidden');
      document.getElementById('action-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('action-modal').classList.add('hidden');
      document.getElementById('action-modal').classList.remove('flex');
    }

    function toggleDeliveryNote() {
      const val = document.querySelector('input[name="fulfillment"]:checked').value;
      const box = document.getElementById('delivery-note-box');
      if (val === 'delivery') box.classList.remove('hidden');
      else box.classList.add('hidden');
    }

    document.getElementById('action-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      const buyerWhatsapp = document.getElementById('buyer-whatsapp').value.trim();

      if (modalMode === 'book') {
        const buyerName = document.getElementById('buyer-name').value.trim();
        const fulfillment = document.querySelector('input[name="fulfillment"]:checked').value;
        const deliveryNote = document.getElementById('delivery-note').value.trim();

        const { error } = await db.from('bookings').insert([{
          item_id: selectedItem.id,
          shop_id: currentShop.id,
          buyer_name: buyerName,
          buyer_whatsapp: buyerWhatsapp,
          fulfillment_type: fulfillment,
          delivery_note: deliveryNote || null
        }]);

        if (!error) {
          const msg = encodeURIComponent(
            `Hi ${currentShop.shop_name}! I just booked *${selectedItem.name}* (KES ${selectedItem.price_kes.toLocaleString()}) on SokoLink.\n\nName: ${buyerName}\nOption: ${fulfillment.toUpperCase()}${deliveryNote ? ` (${deliveryNote})` : ''}`
          );
          closeModal();
          window.location.href = `https://wa.me/${currentShop.whatsapp_number}?text=${msg}`;
        } else {
          alert('Error saving booking. Please try again.');
        }
      } else {
        const { error } = await db.from('waitlist').insert([{
          item_id: selectedItem.id,
          shop_id: currentShop.id,
          buyer_whatsapp: buyerWhatsapp
        }]);

        if (!error) {
          closeModal();
          alert(`You're on the list! We'll alert ${buyerWhatsapp} as soon as "${selectedItem.name}" is back in stock.`);
        } else {
          alert('Error joining waitlist. Please try again.');
        }
      }

      btn.disabled = false;
    });

    loadStorefront();
  </script>
</body>
</html>
